version: 2
updates:
  # Python dependencies in the sample app
  - package-ecosystem: "pip"
    directory: "/sample_app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions themselves (e.g. actions/checkout, gitleaks-action)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
